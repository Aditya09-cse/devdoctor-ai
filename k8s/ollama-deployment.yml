apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: ai-incident-namespace

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:

      initContainers:
      - name: ollama-model-init
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent

        command:
        - sh
        - -c
        - |
          ollama serve &
          sleep 10
          ollama pull tinyllama:latest

        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama


      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 11434

        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 15

        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10

        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama


      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-incident-pvc
